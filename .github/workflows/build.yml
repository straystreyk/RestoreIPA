name: Build release artifacts

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    name: Windows x64
    runs-on: windows-2025
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-lock.txt
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.5"
          cache: false
      - name: Install Inno Setup
        shell: pwsh
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe") -and
              -not (Test-Path "$env:ProgramFiles\Inno Setup 6\ISCC.exe")) {
            choco install innosetup --no-progress --yes
          }
      - name: Build Restore for Windows
        shell: pwsh
        run: .\build.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: Restore-1.2.2-windows-x64-${{ github.sha }}
          if-no-files-found: error
          retention-days: 14
          path: |
            dist/RestoreAppStore.exe
            dist/RestoreSetup-*.exe
            dist/SHA256SUMS.txt

  macos:
    name: macOS arm64
    runs-on: macos-15
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-lock.txt
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.5"
          cache: false
      - name: Build Restore for macOS
        env:
          PYTHON: python3
        run: bash build_mac.sh
      - uses: actions/upload-artifact@v4
        with:
          name: Restore-1.2.2-macos-arm64-${{ github.sha }}
          if-no-files-found: error
          retention-days: 14
          path: |
            dist/Restore-*-macos-arm64.dmg
            dist/Restore-*-macos-arm64.dmg.sha256
